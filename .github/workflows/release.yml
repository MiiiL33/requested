name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  # Required for npm trusted publishing (OIDC). Without it, publishing fails
  # with a misleading E404 rather than an auth error.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Latest 22.x, which clears the >= 22.14.0 that trusted publishing
          # needs. Pinning an exact patch only starves the job of security
          # updates and pins it below what current npm requires.
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10.x, which predates OIDC support (needs >= 11.5.1).
      #
      # The major is pinned rather than tracking `latest`: npm 12 requires
      # Node ^22.22.2 || ^24.15.0, so `npm@latest` breaks the moment npm's
      # engine floor moves past whatever Node this job runs. npm 11 accepts
      # ^20.17.0 || >=22.9.0 and is comfortably past the OIDC floor.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      # Changesets handles versioning only. When changesets are pending it
      # opens/updates the "version packages" PR; once that PR is merged there
      # are none left, and the publish step below runs.
      - id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          commit: 'version packages'
          title: 'version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm verify

      # Publishing is not delegated to changesets: `pnpm publish` cannot
      # authenticate via OIDC on pnpm 11 (pnpm/pnpm#11513), and changesets/action
      # E404s on scoped packages over OIDC (npm/cli#8976). The script packs with
      # pnpm (to rewrite workspace:* deps) and uploads with npm (which supports
      # OIDC). No NPM_TOKEN anywhere — auth is a short-lived OIDC token.
      - name: Publish to npm
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: node scripts/publish-packages.mjs

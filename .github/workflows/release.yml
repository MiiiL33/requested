name: Release

# Changesets was dropped because it requires committing Markdown (.changeset/*.md
# and generated CHANGELOG.md), and this repo allows README.md only.
# Releases are therefore cut from a version tag: bump the package.json versions,
# tag `vX.Y.Z` on main, and this publishes.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency: release

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Never publish something that would not pass CI.
      - run: pnpm verify

      - run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

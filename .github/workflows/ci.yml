name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json — specifying it
      # here as well makes the action fail on the conflict.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      # The compliance guarantee: no store-publishable build may reach the
      # automation adapter. See scripts/check-boundaries.mjs.
      - name: Check architecture boundaries
        run: pnpm check:boundaries

      # This repo is public: only README.md may be committed. Keeps working
      # notes, plans and agent instruction files out of it.
      - name: Check tracked docs
        run: pnpm check:docs
